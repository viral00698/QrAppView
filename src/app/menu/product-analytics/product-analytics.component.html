<div class="container-fluid">
  <div class="row">
    <div class="col-sm-6 col-md-6 cols-6">
      <div class="d-flex justify-content-start">
        <p-calendar class="inputCalender" [minDate]="minDate" [(ngModel)]="date" formControlName="date" [placeholder]="'Search by Date...'" />
      </div>
    </div>
    <div class="col-sm-6 col-md-6 cols-6">
      <div class="d-flex justify-content-end">
        <p-dropdown [options]="cities" optionLabel="name" [showClear]="true" placeholder="Select a filter" />
        <!-- <p-calendar class="inputCalender" [minDate]="minDate" [(ngModel)]="date" formControlName="date" [placeholder]="'Search by Date...'" /> -->
      </div>
    </div>
  </div>
</div>

<div class="container-fluid">
  <div class="row p-1">
    <div class="col-sm-3 col-md-3 col-lg-3 cardstyle">
      <p-card header="Orders" class="custom-card">
        <ng-template pTemplate="content">
          <h4>4458</h4>
        </ng-template>
        <ng-template pTemplate="footer">
          <div>
            <h6 style="color: green;">ongoing:6<i class="pi pi-arrow-up"></i></h6>
          </div>
        </ng-template>
      </p-card>
    </div>
    <div class="col-sm-3 col-md-3 col-lg-3 cardstyle">
      <p-card header="Revenue" class="custom-card">

        <ng-template pTemplate="footer">
          <div>

    <div class="col-sm-3 col-md-3 col-lg-3 cardstyle">
      <p-card header="Cash" class="custom-card">
        <ng-template pTemplate="content">
          <h4>4458</h4>
        </ng-template>
        <!-- <ng-template pTemplate="footer">
                            <div>
                                <h6 style="color: green;">ongoing:6</h6>
                            </div>
                 </ng-template> -->

    </div>
    <div class="col-sm-3 col-md-3 col-lg-3 cardstyle">

<div class="container-fluid">
  <div class="row">
    <div class="col-sm-4 col-md-4 col-lg-4 cols-12">
      <p-chart type="bar" [data]="data" [options]="options" />
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4 cols-12">
      <p-chart type="line" [data]="data" [options]="options" />
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4 cols-12">
      <p-chart type="pie" [data]="data" [options]="options" />
    </div>
  </div>
</div>
